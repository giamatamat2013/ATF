<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדגמות ATF ו-Python</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e2e5ea;
    --code-bg: #1e2430;
    --code-text: #e6e9ef;
    --accent: #2563eb;
    --atf: #0f766e;
    --py: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c;
      --panel: #1b1f27;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2d3340;
      --code-bg: #0d1017;
      --code-text: #d7dce5;
      --accent: #60a5fa;
      --atf: #5eead4;
      --py: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c;
    --panel: #1b1f27;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #2d3340;
    --code-bg: #0d1017;
    --code-text: #d7dce5;
    --accent: #60a5fa;
    --atf: #5eead4;
    --py: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 16px 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  .layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  nav button {
    text-align: right;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    cursor: pointer;
  }
  nav button[aria-current="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }
  main { min-width: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .card > p { margin: 0 0 12px; color: var(--muted); }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .pair > div { min-width: 0; }
  .label {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .label.atf { color: var(--atf); }
  .label.py { color: var(--py); }
  pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    font: 0.88rem/1.5 Consolas, "Courier New", monospace;
  }
  .output { margin-top: 12px; }
  .output .label { color: var(--muted); }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  .toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .toolbar .status { color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { flex-direction: row; flex-wrap: wrap; }
    nav button { flex: 1 1 auto; text-align: center; }
    .pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>הדגמות: ATF מול Python</h1>
  <p>אותו סקריפט בשתי השפות, עם הפלט שלו. בחרו הדגמה מהתפריט.</p>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <section class="card" id="demo"></section>
  </main>
</div>

<script>
const demos = [
  {
    title: "שלום עולם",
    desc: "הדפסה בסיסית של שורה אחת.",
    atf: `fn main() {
    println("Hello, world!")
}`,
    py: `print("Hello, world!")`,
    output: `Hello, world!`
  },
  {
    title: "ברכה עם קלט",
    desc: "קריאת שם מהמשתמש והדפסה עם שילוב משתנה במחרוזת.",
    atf: `fn main() {
    let name = input("What is your name? ")
    println("Hello, {name}!")
}`,
    py: `name = input("What is your name? ")
print(f"Hello, {name}!")`,
    output: `What is your name? Ada
Hello, Ada!`
  },
  {
    title: "סדרת פיבונאצ'י",
    desc: "פונקציה רקורסיבית שמחשבת את האיברים הראשונים בסדרה.",
    atf: `fn fib(n: int) -> int {
    if n < 2 { return n }
    return fib(n - 1) + fib(n - 2)
}

fn main() {
    for i in 0..10 {
        println(i, fib(i))
    }
}`,
    py: `def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)

for i in range(10):
    print(i, fib(i))`,
    output: `0 0
1 1
2 1
3 2
4 3
5 5
6 8
7 13
8 21
9 34`
  },
  {
    title: "ספירת מילים",
    desc: "מילון שסופר כמה פעמים מופיעה כל מילה במשפט.",
    atf: `fn main() {
    var counts: {str: int} = {}
    for w in "the cat and the hat".split(" ") {
        counts[w] = counts.get(w, 0) + 1
    }
    println(counts)
}`,
    py: `counts = {}
for w in "the cat and the hat".split(" "):
    counts[w] = counts.get(w, 0) + 1
print(counts)`,
    output: `{"the": 2, "cat": 1, "and": 1, "hat": 1}   (ATF)
{'the': 2, 'cat': 1, 'and': 1, 'hat': 1}   (Python)`
  },
  {
    title: "רשימה מסוננת",
    desc: "הפקת ריבועים של מספרים זוגיים בעזרת list comprehension.",
    atf: `fn main() {
    let squares = [x * x for x in 1..=6 if x % 2 == 0]
    println(squares)
}`,
    py: `squares = [x * x for x in range(1, 7) if x % 2 == 0]
print(squares)`,
    output: `[4, 16, 36]`
  },
  {
    title: "צורות וחישוב שטח",
    desc: "טיפוס מסוג enum עם נתונים, וחישוב שטח לפי סוג הצורה.",
    atf: `enum Shape {
    Circle(float),
    Rect(float, float)
}

fn area(s: Shape) -> float {
    return match s {
        Shape.Circle(r) => PI * r * r
        Shape.Rect(w, h) => w * h
    }
}

fn main() {
    let shapes = [Shape.Circle(1.0), Shape.Rect(2.0, 3.5)]
    for s in shapes { println(s, "area {area(s):.3}") }
}`,
    py: `import math

def area(s):
    match s:
        case ("Circle", r):
            return math.pi * r * r
        case ("Rect", w, h):
            return w * h

shapes = [("Circle", 1.0), ("Rect", 2.0, 3.5)]
for s in shapes:
    print(s, f"area {area(s):.3f}")`,
    output: `Shape.Circle(1.0) area 3.142    (ATF)
Shape.Rect(2.0, 3.5) area 7.000

("Circle", 1.0) area 3.142      (Python)
("Rect", 2.0, 3.5) area 7.000`
  },
  {
    title: "קלט עם בדיקת שגיאות",
    desc: "המרת טקסט למספר, וטיפול בשגיאות בלי להפיל את התוכנית.",
    atf: `fn parse_age(text: str) -> Result<int, str> {
    let n = text.parse_int()
    if n == nil { return Result.Err("'{text}' is not a number") }
    if n! < 0 { return Result.Err("an age cannot be negative") }
    return Result.Ok(n!)
}

fn main() {
    for t in ["42", "-3", "abc"] {
        match parse_age(t) {
            Result.Ok(a) => println("age", a)
            Result.Err(e) => println("error:", e)
        }
    }
}`,
    py: `def parse_age(text):
    try:
        n = int(text)
    except ValueError:
        raise ValueError(f"'{text}' is not a number")
    if n < 0:
        raise ValueError("an age cannot be negative")
    return n

for t in ["42", "-3", "abc"]:
    try:
        print("age", parse_age(t))
    except ValueError as e:
        print("error:", e)`,
    output: `age 42
error: an age cannot be negative
error: 'abc' is not a number`
  },
  {
    title: "עגלת קניות",
    desc: "מבנה נתונים עם ערכי ברירת מחדל, חישוב סכום, ועיצוב טקסט בטבלה.",
    atf: `struct Item {
    name: str,
    price: float,
    count: int = 1
}

fn total(items: [Item]) -> float {
    return items.map(|it| it.price * float(it.count)).sum()
}

fn main() {
    let cart = [Item{ name: "apple", price: 0.5, count: 6 }, Item{ name: "bread", price: 2.25 }]
    for it in cart {
        println("{it.name:<8} x{it.count}  {it.price * float(it.count):>6.2}")
    }
    println("total: {total(cart):.2}")
}`,
    py: `from dataclasses import dataclass

@dataclass
class Item:
    name: str
    price: float
    count: int = 1

def total(items):
    return sum(it.price * it.count for it in items)

cart = [Item("apple", 0.5, 6), Item("bread", 2.25)]
for it in cart:
    print(f"{it.name:<8} x{it.count}  {it.price * it.count:>6.2f}")
print(f"total: {total(cart):.2f}")`,
    output: `apple    x6    3.00
bread    x1    2.25
total: 5.25`
  }
];

const nav = document.getElementById("nav");
const view = document.getElementById("demo");
const savedKey = "atf-demo-index";

function readSaved() {
  try {
    const v = Number(localStorage.getItem(savedKey));
    return Number.isInteger(v) && v >= 0 && v < demos.length ? v : 0;
  } catch (e) {
    return 0;
  }
}

function saveIndex(i) {
  try { localStorage.setItem(savedKey, String(i)); } catch (e) { /* ignore */ }
}

function block(text, cls) {
  const pre = document.createElement("pre");
  pre.textContent = text;
  pre.className = cls || "";
  return pre;
}

function labeled(labelText, labelCls, text) {
  const wrap = document.createElement("div");
  const label = document.createElement("div");
  label.className = "label " + labelCls;
  label.textContent = labelText;
  wrap.appendChild(label);
  wrap.appendChild(block(text));
  return wrap;
}

function show(i) {
  const d = demos[i];
  view.textContent = "";

  const h = document.createElement("h2");
  h.textContent = d.title;
  const p = document.createElement("p");
  p.textContent = d.desc;
  view.append(h, p);

  const pair = document.createElement("div");
  pair.className = "pair";
  pair.append(labeled("ATF", "atf", d.atf), labeled("Python", "py", d.py));
  view.appendChild(pair);

  const out = document.createElement("div");
  out.className = "output";
  const outLabel = document.createElement("div");
  outLabel.className = "label";
  outLabel.textContent = "פלט";
  out.append(outLabel, block(d.output));
  view.appendChild(out);

  const bar = document.createElement("div");
  bar.className = "toolbar";
  const copyAtf = document.createElement("button");
  copyAtf.textContent = "העתק ATF";
  const copyPy = document.createElement("button");
  copyPy.textContent = "העתק Python";
  copyPy.className = "secondary";
  const status = document.createElement("span");
  status.className = "status";

  const copy = (text, label) => {
    const done = () => { status.textContent = label + " הועתק"; };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done, () => { status.textContent = "העתקה נכשלה"; });
    } else {
      status.textContent = "הדפדפן לא תומך בהעתקה";
    }
  };
  copyAtf.addEventListener("click", () => copy(d.atf, "ATF"));
  copyPy.addEventListener("click", () => copy(d.py, "Python"));

  bar.append(copyAtf, copyPy, status);
  view.appendChild(bar);

  [...nav.children].forEach((b, idx) => {
    b.setAttribute("aria-current", idx === i ? "true" : "false");
  });
}

demos.forEach((d, i) => {
  const b = document.createElement("button");
  b.textContent = d.title;
  b.addEventListener("click", () => { show(i); saveIndex(i); });
  nav.appendChild(b);
});

show(readSaved());
</script>
</body>
</html>
