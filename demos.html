<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדריך ATF</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e2e5ea;
    --code-bg: #1e2430;
    --code-text: #e6e9ef;
    --accent: #2563eb;
    --atf: #0f766e;
    --py: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c;
      --panel: #1b1f27;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2d3340;
      --code-bg: #0d1017;
      --code-text: #d7dce5;
      --accent: #60a5fa;
      --atf: #5eead4;
      --py: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c;
    --panel: #1b1f27;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #2d3340;
    --code-bg: #0d1017;
    --code-text: #d7dce5;
    --accent: #60a5fa;
    --atf: #5eead4;
    --py: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 24px 16px 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  .layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
    align-items: start;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  nav .chapter {
    margin: 10px 0 2px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  nav button {
    text-align: right;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  nav button[aria-current="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }
  main { min-width: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .kicker { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
  .card h2 { margin: 2px 0 10px; font-size: 1.4rem; }
  .card p { margin: 0 0 10px; }
  .card code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
    font: 0.9em Consolas, "Courier New", monospace;
    direction: ltr;
    unicode-bidi: embed;
  }
  .label {
    font-size: 0.85rem;
    font-weight: 600;
    margin: 14px 0 4px;
  }
  .label.atf { color: var(--atf); }
  .label.py { color: var(--py); }
  .label.out { color: var(--muted); }
  pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    font: 0.88rem/1.5 Consolas, "Courier New", monospace;
  }
  details { margin-top: 14px; }
  details summary { cursor: pointer; color: var(--py); font-weight: 600; }
  details pre { margin-top: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }
  .toolbar .status { color: var(--muted); font-size: 0.9rem; }
  .toolbar .spacer { flex: 1; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; }
    nav .chapter { flex-basis: 100%; }
    nav button { flex: 1 1 auto; text-align: center; }
  }
</style>
</head>
<body>
<header>
  <h1>מדריך ATF</h1>
  <p>שיעור אחרי שיעור: הסבר, קוד שאפשר להריץ והפלט האמיתי שלו. בסוף כל שיעור אפשר לראות איך אותו דבר נראה ב-Python.</p>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <section class="card" id="lesson"></section>
  </main>
</div>

      "הטיפוסים הבסיסיים: `int`, `float`, `str`, `bool`. המרות הן תמיד מפורשות: `int(3.9)`, `float(7)`, `str(42)`.",

const nav = document.getElementById("nav");
const view = document.getElementById("lesson");
const savedKey = "atf-tutorial-index";

function readSaved() {
  try {
    const v = Number(localStorage.getItem(savedKey));
    return Number.isInteger(v) && v >= 0 && v < lessons.length ? v : 0;
  } catch (e) {
    return 0;
  }
}

function saveIndex(i) {
  try { localStorage.setItem(savedKey, String(i)); } catch (e) { /* ignore */ }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function code(text) {
  return el("pre", "", text);
}

// `x` inside a paragraph becomes <code>x</code>
function paragraph(text) {
  const p = el("p");
  text.split("`").forEach((part, i) => {
    p.appendChild(i % 2 ? el("code", "", part) : document.createTextNode(part));
  });
  return p;
}

function show(i) {
  const d = lessons[i];
  view.textContent = "";

  view.appendChild(el("div", "kicker", d.chapter + " · שיעור " + (i + 1) + " מתוך " + lessons.length));
  view.appendChild(el("h2", "", d.title));
  d.text.forEach(t => view.appendChild(paragraph(t)));

  view.appendChild(el("div", "label atf", "קוד ATF"));
  view.appendChild(code(d.atf));

  view.appendChild(el("div", "label out", "פלט"));
  view.appendChild(code(d.output));

  if (d.py) {
    const det = el("details");
    det.appendChild(el("summary", "", "השוואה ל-Python"));
    det.appendChild(code(d.py));
    view.appendChild(det);
  }

  const bar = el("div", "toolbar");
  const prev = el("button", "secondary", "→ השיעור הקודם");
  const next = el("button", "", "השיעור הבא ←");
  prev.disabled = i === 0;
  next.disabled = i === lessons.length - 1;
  prev.addEventListener("click", () => go(i - 1));
  next.addEventListener("click", () => go(i + 1));
  const status = el("span", "status");
  const copyAtf = el("button", "secondary", "העתק ATF");
  copyAtf.addEventListener("click", () => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(d.atf).then(
        () => { status.textContent = "הועתק"; },
        () => { status.textContent = "העתקה נכשלה"; });
    } else {
      status.textContent = "הדפדפן לא תומך בהעתקה";
    }
  });
  bar.append(prev, next, el("span", "spacer"), copyAtf, status);
  view.appendChild(bar);

  [...nav.querySelectorAll("button")].forEach((b, idx) => {
    b.setAttribute("aria-current", idx === i ? "true" : "false");
  });
}

function go(i) {
  show(i);
  saveIndex(i);
  view.scrollIntoView({ block: "start" });
}

let lastChapter = null;
lessons.forEach((d, i) => {
  if (d.chapter !== lastChapter) {
    nav.appendChild(el("div", "chapter", d.chapter));
    lastChapter = d.chapter;
  }
  const b = el("button", "", (i + 1) + ". " + d.title);
  b.addEventListener("click", () => go(i));
  nav.appendChild(b);
});

show(readSaved());
</script>
